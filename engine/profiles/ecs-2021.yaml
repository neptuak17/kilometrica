# The European Certification Standard, 2021 criteria, for comparing with surveys made under them (D106).
#
# ECF's EuroVelo 15 certification report (September 2025) rests on surveys from 2024-25, before the 2026 edition,
# so this variant of ecs-2026 runs beside it in the comparison. It differs only where the 2021 criteria do: surface
# (asphalt or other resistant paving; at most 1% cobbles or unimproved), dismounting (at most 1% of a daily section),
# a 1% tolerance for traffic one category too high, no toilets, rest-area or warm-meal criteria, and e-bike charging
# under bike services. Source: "ECS quality criteria 2021".
id: ecs-2021
title: European Certification Standard 2021 (open-data audit, for comparison)
source: https://eurovelo.com/download/document/ECS-quality-criteria-2021.pdf
pad_point_m: 200

criteria:
  continuity:
    tier: essential
    group: infrastructure
    basis: route
    rule: continuity
    title: Continuity
    description: >-
      No physical or legal disruption (missing links, ways closed to bikes, barriers that stop a bike); dismounting
      on at most 1% of each daily section.
    max_push_share: 0.01
  stairs:
    tier: important
    group: infrastructure
    basis: route
    rule: stairs
    title: Easy stairs
    description: Steps on the route have a gentle incline and a ramp (OSM ramp:bicycle).
  obstacles:
    tier: additional
    group: infrastructure
    basis: route
    rule: obstacles
    title: Free of obstacles
    description: >-
      No steps, gates or chicanes, no dismounting, and no slope over 6% (standing in for the 2021 limit of 60 m of
      climbing and descent on any 1 km).
    min_clearance_m: 1.3
    slope_classes: [steep, very_steep, extreme]
  traffic:
    tier: essential
    group: infrastructure
    basis: route
    rule: traffic
    title: Traffic
    description: No very high traffic (1% tolerance), and high traffic on at most 50% of each daily section.
    forbid: [very_high]
    max_half: high
    tolerance: 0.01
  traffic_important:
    tier: important
    group: infrastructure
    basis: route
    rule: traffic
    title: Traffic (important)
    description: No high traffic (1% tolerance), and moderate traffic on at most 50% of each daily section.
    forbid: [high, very_high]
    max_half: moderate
    tolerance: 0.01
  traffic_additional:
    tier: additional
    group: infrastructure
    basis: route
    rule: traffic
    title: Traffic (additional)
    description: No moderate traffic (1% tolerance), and low traffic on at most 50% of each daily section.
    forbid: [moderate, high, very_high]
    max_half: low
    tolerance: 0.01
  crossings:
    tier: important
    group: infrastructure
    basis: route
    rule: not_checked
    title: Crossings
    description: No crossing classified as very dangerous. Needs a field survey.
  crossings_additional:
    tier: additional
    group: infrastructure
    basis: route
    rule: not_checked
    title: Crossings (additional)
    description: No crossing classified as dangerous. Needs a field survey.
  surface:
    tier: essential
    group: infrastructure
    basis: daily_section
    rule: surface_share
    title: Surface
    description: >-
      Asphalt or other resistant paving, or consolidated loose material; at most 1% of each daily section on cobbles
      or unimproved surfaces (here: OSM gravel and dirt).
    layer: surface
    classes: [gravel, dirt]
    max_share: 0.01
    maybe: [paved_assumed, unknown, unmatched]
  surface_important:
    tier: important
    group: infrastructure
    basis: daily_section
    rule: surface_share
    title: Surface (important)
    description: At least 50% of each daily section as rideable as high-quality asphalt.
    layer: surface
    classes: [paved_smooth]
    min_share: 0.5
    maybe: [paved_assumed, unknown, unmatched]
  surface_additional:
    tier: additional
    group: infrastructure
    basis: route
    rule: surface_everywhere
    title: Surface (additional)
    description: As rideable as high-quality asphalt everywhere.
    layer: surface
    pass: [paved_smooth]
    fail: [paved_rough, compacted, gravel, dirt]
  width:
    tier: additional
    group: infrastructure
    basis: route
    rule: not_checked
    title: Width
    description: Wide enough for multitrack bikes in both directions. OSM rarely maps widths.
  climbing:
    tier: essential
    group: infrastructure
    basis: daily_section
    rule: climbing
    title: Gradients
    description: Climbing or descent on each daily section at most 1,000 m.
    max_m: 1000
  climbing_important:
    tier: important
    group: infrastructure
    basis: daily_section
    rule: climbing
    title: Gradients (important)
    description: Climbing or descent on each daily section at most 500 m.
    max_m: 500
  signing:
    tier: essential
    group: infrastructure
    basis: daily_section
    rule: signing
    title: Signing
    description: Signed in line with national standards and the EuroVelo guidelines (EuroVelo's published status).
  signing_important:
    tier: important
    group: infrastructure
    basis: route
    rule: not_checked
    title: Signing (important)
    description: No sign missing at main junctions; signs readable at night. Field check.
  signing_additional:
    tier: additional
    group: infrastructure
    basis: route
    rule: not_checked
    title: Signing (additional)
    description: Confirmation signs after every junction and every 5 km; destinations every 15 km. Field check.
  attractions:
    tier: essential
    group: attractiveness
    basis: daily_section
    rule: attraction
    title: Attractions
    description: At least one significant cultural or natural attraction, or a highly attractive landscape.
    max_offset_m: 2000
    themes: [coast, mountains, water, forest, viewpoints, wine]
    min_theme: 0.8
  nuisance:
    tier: important
    group: attractiveness
    basis: daily_section
    rule: not_checked
    title: Noise and pollution
    description: At most 25% exposed to noise, dust or smells; an attraction on the route's theme on each section.
  monotony:
    tier: additional
    group: attractiveness
    basis: daily_section
    rule: not_checked
    title: Monotony and social safety
    description: At most 50% through monotonous surroundings; free of social-safety challenges.
  public_transport:
    tier: essential
    group: public_transport
    basis: route
    rule: pt_every
    title: Public transport
    description: Bikes carried at least every 150 km. Two services a day not checked.
    max_gap_m: 150000
  public_transport_important:
    tier: important
    group: public_transport
    basis: route
    rule: pt_every
    title: Public transport (important)
    description: Bikes carried at least every 75 km. Six services a day not checked.
    max_gap_m: 75000
  public_transport_additional:
    tier: additional
    group: public_transport
    basis: route
    rule: not_checked
    title: Public transport (additional)
    description: Special bikes carried every 75 km, six services a day, reservations possible.
  accommodation:
    tier: essential
    group: services
    basis: daily_section
    rule: on_section
    title: Accommodation
    description: Camping, budget or average-standard accommodation on each daily section.
    places: accommodation
  accommodation_choice:
    tier: important
    group: services
    basis: daily_section
    rule: on_section
    title: Accommodation choice
    description: Accommodation on each daily section not limited to camping.
    places: rooms
  cyclist_friendly:
    tier: additional
    group: services
    basis: daily_section
    rule: not_checked
    title: Cyclist-friendly accommodation
    description: Some accommodation certified as cyclist-friendly. We hold no label data.
  food_water:
    tier: essential
    group: services
    basis: daily_section
    rule: on_section
    title: Food and water
    description: Food (a shop, café, restaurant or vending machine) and drinking water on each daily section.
    places: food
  food_every_15:
    tier: additional
    group: services
    basis: route
    rule: every
    title: Food or rest area every 15 km
    description: Food or a rest area at least every 15 km.
    places: food_or_rest
    max_gap_m: 15000
  water_every_15:
    tier: additional
    group: services
    basis: route
    rule: every
    title: Water every 15 km
    description: Drinking water at least every 15 km.
    places: water
    max_gap_m: 15000
  cycle_repair:
    tier: essential
    group: services
    basis: daily_section
    rule: on_section
    title: Bike services
    description: A bike repair workshop, bike shop, vending machine with spare parts or self-service station.
    places: repair
  repair_shop:
    tier: important
    group: services
    basis: daily_section
    rule: on_section
    title: Bike repair workshop
    description: A bike repair workshop (or helpline) on each daily section; helplines are not checked.
    places: bike_shop
  ebike_charging:
    tier: additional
    group: services
    basis: daily_section
    rule: on_section
    title: Pedelec charging
    description: A pedelec charging station on each daily section. Passes where OSM maps one, otherwise unknown.
    places: charging
    missing: unknown
  bookable_offers:
    tier: important
    group: services
    basis: daily_section
    rule: not_checked
    title: Bookable offers
    description: Each daily section included in at least one cycling-holiday offer.
  website:
    tier: essential
    group: communication
    basis: route
    rule: not_checked
    title: Promotion
    description: The route's promotion criteria (websites, maps). Not checked.

findings:
  busy_road_min_m: 1000
  busy_road_merge_m: 1000
  unpaved_min_m: 1000
  unmatched_min_m: 300
  steep_min_m: 300
  climb_min_fiets: 2.0
  merge_gap_m: 200
  osm_route_min_share: 0.5
  length_mismatch: 0.10
